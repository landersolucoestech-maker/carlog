<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Car Log Admin OS</title>
</head>
<body>
  <p><a id="admin-link" href="/carlog/admin/">Open Car Log Admin OS</a></p>
  <script>
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const projectBase = window.location.hostname.endsWith('github.io') && pathParts.length
      ? `/${pathParts[0]}/`
      : '/';
    const target = `${projectBase}admin/${window.location.search}${window.location.hash}`;
    document.getElementById('admin-link').setAttribute('href', target);
    window.location.replace(target);
  </script>
</body>
</html>
