name: Car Log Admin OS Preview

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: carlog-admin-pages-preview
  cancel-in-progress: true

jobs:
  build_preview:
    name: Build Admin Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARLOG_PAGES_PREVIEW: '1'
      NEXT_PUBLIC_PREVIEW_MODE: '1'
      NEXT_PUBLIC_API_URL: https://api.preview.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_preview_only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Verify branch
        run: |
          test "$(git branch --show-current)" = "dev"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter './packages/**' run build

      - name: Build admin preview
        run: pnpm --filter @carlog/admin build

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-preview
          mkdir -p .pages-preview/admin
          cp -R apps/admin/out/. .pages-preview/admin/
          cat > .pages-preview/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./admin/">
            <title>Car Log Admin OS Preview</title>
          </head>
          <body>
            <p><a href="./admin/">Open Car Log Admin OS Preview</a></p>
          </body>
          </html>
          HTML
          touch .pages-preview/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-preview

  deploy_preview:
    name: Deploy Admin Preview
    needs: build_preview
    runs-on: ubuntu-latest
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Preview summary
        run: |
          echo "### Car Log Admin OS Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Admin: ${{ steps.deployment.outputs.page_url }}admin/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: read-only preview" >> "$GITHUB_STEP_SUMMARY"
