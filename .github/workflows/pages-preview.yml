name: Car Log GitHub Pages Preview

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: carlog-pages-preview
  cancel-in-progress: true

jobs:
  build_preview:
    name: Build Pages Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARLOG_PAGES_PREVIEW: '1'
      NEXT_PUBLIC_PREVIEW_MODE: '1'
      NEXT_PUBLIC_API_URL: https://api.carlogconnection.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_preview_only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Verify branch
        run: |
          test "$(git branch --show-current)" = "dev"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter './packages/**' run build

      - name: Build public website preview
        run: pnpm --filter @carlog/web build

      - name: Build admin preview
        run: pnpm --filter @carlog/admin build

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-preview
          mkdir -p .pages-preview/admin
          cp -R apps/web/out/. .pages-preview/
          cp -R apps/admin/out/. .pages-preview/admin/
          touch .pages-preview/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-preview

  deploy_preview:
    name: Deploy Pages Preview
    needs: build_preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Preview summary
        run: |
          echo "### Car Log GitHub Pages Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Website: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Admin: ${{ steps.deployment.outputs.page_url }}admin/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: read-only preview" >> "$GITHUB_STEP_SUMMARY"
