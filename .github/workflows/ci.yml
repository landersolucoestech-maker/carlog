name: Car Log CI

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carlog-dev-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Verify branch
        run: |
          test "$(git branch --show-current)" = "dev"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Core typecheck and tests
        run: npm run check:core

      - name: Architecture audit
        run: npm run audit:architecture

      - name: Build shared packages
        run: pnpm -r --filter './packages/**' run build

      - name: Build API
        run: pnpm --filter @carlog/api build

      - name: Build worker
        run: pnpm --filter @carlog/worker build

      - name: Build public web
        run: pnpm --filter @carlog/web build

      - name: Build admin
        run: pnpm --filter @carlog/admin build

  deploy_hostinger:
    name: Deploy Hostinger
    needs: validate
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      HOSTINGER_HOST: ${{ vars.HOSTINGER_HOST }}
      HOSTINGER_USER: ${{ vars.HOSTINGER_USER }}
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      HOSTINGER_PORT: ${{ vars.HOSTINGER_PORT || '22' }}
      HOSTINGER_APP_PATH: ${{ vars.HOSTINGER_APP_PATH || '.local/share/carlog' }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Verify deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "dev"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev)"
          for name in HOSTINGER_HOST HOSTINGER_USER; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions production variable: $name" >&2
              exit 1
            fi
          done
          if [[ -z "${HOSTINGER_SSH_PRIVATE_KEY:-}" ]]; then
            echo "Missing required GitHub Actions production secret: HOSTINGER_SSH_PRIVATE_KEY" >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > "$HOME/.ssh/carlog_hostinger"
          chmod 600 "$HOME/.ssh/carlog_hostinger"
          ssh-keyscan -p "$HOSTINGER_PORT" -H "$HOSTINGER_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy dev to Hostinger VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/carlog_hostinger" \
            -p "$HOSTINGER_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "bash -s -- '$HOSTINGER_APP_PATH'" <<'REMOTE'
          set -euo pipefail
          app_path="$1"
          if [[ "$app_path" != /* ]]; then
            app_path="$HOME/$app_path"
          fi
          repo_url="https://github.com/landersolucoestech-maker/carlog.git"

          if [[ ! -d "$app_path/.git" ]]; then
            mkdir -p "$(dirname "$app_path")"
            git clone --branch dev --single-branch "$repo_url" "$app_path"
          fi

          cd "$app_path"
          git fetch --prune origin
          if [[ "$(git branch --show-current)" != "dev" ]]; then
            echo "Hostinger checkout must remain on dev." >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Hostinger checkout has uncommitted changes; refusing destructive deployment." >&2
            exit 1
          fi
          git pull --ff-only origin dev
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/dev)"
          bash infrastructure/hostinger/deploy.sh
          REMOTE

      - name: Verify production endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors https://carlogconnection.com/ >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors https://admin.carlogconnection.com/ >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors https://api.carlogconnection.com/health | grep -q '"status":"ok"'

      - name: Deployment summary
        if: success()
        run: |
          echo "### Car Log deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Website: https://carlogconnection.com/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Admin: https://admin.carlogconnection.com/" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://api.carlogconnection.com/health" >> "$GITHUB_STEP_SUMMARY"
