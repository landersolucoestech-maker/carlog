<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Car Log Connection</title>
  <style>
    html,body,iframe{margin:0;width:100%;height:100%;border:0}
    html,body{overflow:hidden}
    iframe{display:block}
  </style>
</head>
<body>
  <iframe id="site" src="https://carlogconnection.com/" title="Car Log Connection"></iframe>
  <script>
    const p = location.pathname.replace(/^\/carlog\/?/, "");
    const q = location.search || "";
    const h = location.hash || "";
    document.getElementById("site").src =
      "https://carlogconnection.com/" + p + q + h;
  </script>
</body>
</html>
