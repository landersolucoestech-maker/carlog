<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Car Log Connection broker management and website CMS workspace">
  <title>Car Log Admin</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">CL</div>
        <div><strong>Car Log</strong><span>Broker & CMS</span></div>
      </div>
      <nav id="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-footer">
        <a href="../" class="site-link">↗ Open public site</a>
        <span>Local prototype · dev</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-only" id="menuButton" aria-label="Toggle navigation">☰</button>
        <div>
          <div class="eyebrow" id="breadcrumb">Broker Management</div>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <label class="global-search"><span>⌕</span><input id="globalSearch" placeholder="Search records" aria-label="Search records"></label>
          <button class="button primary" id="primaryAction">New lead</button>
        </div>
      </header>
      <section class="content" id="app" aria-live="polite"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <div class="modal-layer" id="modalLayer" hidden></div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
